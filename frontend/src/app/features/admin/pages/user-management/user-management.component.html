<section class="page-card">
  <h1 class="page-title">User Management</h1>
  <div class="page-subtitle">Protected by `settings.user.manage`. User creation is audit logged on the backend.</div>

  <form class="form-grid" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span>Username</span>
      <input type="text" formControlName="username" />
    </label>
    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" />
    </label>
    <label class="field">
      <span>Full Name</span>
      <input type="text" formControlName="full_name" />
    </label>
    <label class="field">
      <span>Password</span>
      <input type="text" formControlName="password" />
    </label>
    <label class="field">
      <span>Role</span>
      <select formControlName="role_code">
        @for (role of roles; track role.id) {
          <option [value]="role.code">{{ role.name }} ({{ role.code }})</option>
        }
      </select>
    </label>
    <div style="grid-column:1/-1;">
      <button class="primary-btn" type="submit">Create User</button>
    </div>
  </form>

  <table class="table" style="margin-top:1rem;">
    <thead>
      <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Branch</th>
        <th>Roles</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users; track user.id) {
        <tr>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.branch_id || '-' }}</td>
          <td>{{ getRoleCodes(user) }}</td>
        </tr>
      }
    </tbody>
  </table>
</section>
