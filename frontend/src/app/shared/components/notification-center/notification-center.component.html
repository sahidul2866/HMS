<div class="notification-stack">
  @for (item of notificationService.items(); track item.id) {
    <div class="notification-item" [class]="'notification-item ' + item.level">
      <div class="notification-item__icon">{{ getIcon(item) }}</div>
      <div class="notification-item__content">
        <div class="notification-item__heading">
          <strong>{{ getTitle(item.level) }}</strong>
          <span>{{ getAgeLabel(item) }}</span>
        </div>
        <div>{{ item.message }}</div>
      </div>
      <button class="notification-close" type="button" aria-label="Dismiss notification" (click)="dismiss(item.id)">×</button>
      <div class="notification-item__progress" [style.animation-duration.ms]="item.durationMs"></div>
    </div>
  }
</div>
