<div class="tab-strip">
  @for (tab of tabService.tabs(); track tab.path) {
    <button class="tab-button" [class.active]="tab.path === tabService.activePath()" type="button" (click)="activate(tab.path)">
      <span>{{ tab.label }}</span>
      <span class="tab-close" (click)="close($event, tab.path)">x</span>
    </button>
  }
</div>
